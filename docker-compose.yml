volumes:
  grafana-storage:  # "caché", interne à Docker
  airflow_home:

services:
  inference-api:
    build:
      context: .
      target: runtime
    environment:
      SPACY_N_PROCESS: "1"
      TZ: Europe/Paris
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - .:/app

  tests:
    build:
      context: .
      target: test
    environment:
      API_BASE_URL: "http://inference-api:8000"
      SPACY_N_PROCESS: "1"
      TZ: Europe/Paris
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - .:/app

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    command: mlflow ui --backend-store-uri /mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns

  prometheus:
    image: prom/prometheus:v3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/

  airflow:
    image: apache/airflow:2.9.3
    container_name: rakuten-airflow
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW_CONN_TRAINING_API: "http://:@inference-api:8000?extra__http__headers=%7B%22X-API-Key%22%3A+%22${API_KEY}%22%7D"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_home:/opt/airflow
    ports:
      - "8080:8080"
