services:
  inference-api:
    build:
      context: .
      target: runtime
    environment:
      SPACY_N_PROCESS: "1"
      TZ: Europe/Paris
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - .:/app

  tests:
    build:
      context: .
      target: test
    environment:
      API_BASE_URL: "http://inference-api:8000"
      SPACY_N_PROCESS: "1"
      TZ: Europe/Paris
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - .:/app

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    command: mlflow ui --backend-store-uri /mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
  prometheus:
    image: prom/prometheus:v3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
